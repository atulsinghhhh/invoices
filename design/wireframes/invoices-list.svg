<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <rect width="1200" height="800" fill="#fff"/>
  <rect x="24" y="24" width="1152" height="64" fill="#f3f4f6"/>
  <text x="40" y="64" font-family="Arial" font-size="18" fill="#111827">Invoices</text>

  <!-- Filters -->
  <rect x="40" y="104" width="320" height="44" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="56" y="132" font-family="Arial" font-size="12" fill="#6b7280">Search invoices or customers</text>
  <rect x="380" y="104" width="160" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <text x="396" y="132" font-family="Arial" font-size="12" fill="#6b7280">Status: All</text>
  <rect x="560" y="104" width="200" height="44" rx="8" fill="#fff" stroke="#e5e7eb"/>
  <text x="576" y="132" font-family="Arial" font-size="12" fill="#6b7280">Date range</text>

  <!-- Outstanding summary -->
  <rect x="780" y="104" width="256" height="44" rx="8" fill="#111827"/>
  <text x="796" y="132" font-family="Arial" font-size="12" fill="#fff">Total outstanding</text>
  <text x="932" y="132" font-family="Arial" font-size="16" fill="#fff">₹ 12,450</text>

  <!-- Table header -->
  <rect x="40" y="164" width="1152" height="40" fill="#f3f4f6"/>
  <g font-family="Arial" font-size="13" fill="#374151">
    <text x="64" y="190">Invoice</text>
    <text x="220" y="190">Customer</text>
    <text x="520" y="190">Amount</text>
    <text x="700" y="190">Due</text>
    <text x="820" y="190">Status</text>
    <text x="980" y="190">Actions</text>
  </g>

  <!-- Table rows (wireframe) -->
  <g font-family="Arial" font-size="13" fill="#6b7280">
    <text x="64" y="224">INV-0012</text>
    <text x="220" y="224">Acme Corp</text>
    <text x="520" y="224">₹ 4,500</text>
    <text x="700" y="224">2026-07-01</text>
    <text x="820" y="224">SENT</text>

    <text x="64" y="254">INV-0011</text>
    <text x="220" y="254">Beta Ltd</text>
    <text x="520" y="254">₹ 8,000</text>
    <text x="700" y="254">2026-06-15</text>
    <text x="820" y="254">PAID</text>
  </g>

  <!-- Pagination / controls -->
  <rect x="40" y="700" width="120" height="36" rx="6" fill="#fff" stroke="#e5e7eb"/>
  <text x="64" y="725" font-family="Arial" font-size="13" fill="#6b7280">Rows 1–20</text>
</svg>